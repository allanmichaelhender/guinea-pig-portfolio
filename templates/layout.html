<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            Django App
        {% endblock%}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav>
          <ul>
            <li><a href="/" title = "About">About</a></li>
            <li><a href="/portfolio_tester/form" title = "Portfolio Creator">Portfolio Creator</a></li>
            <li><a title = "View My Portfolios" href="{% url 'portfolio_tester:my_portfolios' %}">My Porfolios</a></li>


            {% if user.is_authenticated %}
                    <li><a href="{% url 'users:logout' %}" title = "User Login">Logout</a></li>

            {% else %}
                    <li><a href="{% url 'users:register' %}" title = "New User">Create Account</a></li>
                    <li><a href="{% url 'users:login' %}" title = "User Login">Login</a></li>
            {% endif %}
          </ul>
    </nav>
        <main>
            {% block content %}
            {% endblock %}
        </main>
</body>
</html>
